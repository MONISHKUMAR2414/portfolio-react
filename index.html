    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme = stored === 'light' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
